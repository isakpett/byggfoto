<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Byggfoto</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Byggfoto">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1f5f4a">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<style>
  :root {
    --bg: #f3f1ec; --card: #ffffff; --text: #1d1d1b; --muted: #6b6a66;
    --line: #dcd8cf; --accent: #1f5f4a; --accent-text: #ffffff;
    --chip: #ebe8e1; --chip-on: #1f5f4a; --chip-on-text: #fff; --danger: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151614; --card: #20221f; --text: #ecebe6; --muted: #a09f99;
      --line: #383a36; --accent: #3f9c7c; --accent-text: #0d1410;
      --chip: #2c2e2a; --chip-on: #3f9c7c; --chip-on-text: #0d1410; --danger: #f2655c;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 17px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top) 0 calc(110px + env(safe-area-inset-bottom));
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px 6px; max-width: 640px; margin: 0 auto;
  }
  h1 { font-size: 24px; margin: 0; }
  h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 22px 0 8px; }
  main { max-width: 640px; margin: 0 auto; padding: 0 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  label { display: block; font-size: 14px; color: var(--muted); margin: 10px 0 4px; }
  label:first-child { margin-top: 0; }
  input, textarea {
    width: 100%; font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px;
  }
  textarea { min-height: 70px; resize: vertical; }
  input:focus, textarea:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  button {
    font: inherit; font-weight: 600; border: 0; border-radius: 12px; padding: 13px 16px;
    background: var(--chip); color: var(--text); cursor: pointer; min-height: 48px;
  }
  button.primary { background: var(--accent); color: var(--accent-text); }
  button.link { background: none; color: var(--accent); padding: 8px; min-height: 0; }
  button.danger { background: none; color: var(--danger); padding: 8px; min-height: 0; font-weight: 500; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .chip { padding: 9px 14px; min-height: 40px; border-radius: 999px; font-weight: 500; }
  .chip.on { background: var(--chip-on); color: var(--chip-on-text); }
  .photo img { width: 100%; border-radius: 10px; display: block; background: var(--chip); }
  .photo-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-weight: 600; }
  .empty { text-align: center; color: var(--muted); padding: 28px 10px; }
  .addrow { display: flex; gap: 8px; margin-top: 10px; }
  .addrow input { flex: 1; }
  .addrow button { flex: 0 0 auto; }
  .list-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .list-item:last-child { border-bottom: 0; }
  .bar {
    position: fixed; left: 0; right: 0; bottom: 0; background: var(--card);
    border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
  }
  .bar-inner { max-width: 640px; margin: 0 auto; display: flex; gap: 10px; }
  .bar button { flex: 1; }
  .note { font-size: 14px; color: var(--muted); margin: 6px 0 0; }
  .office { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .office span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hidden { display: none !important; }
  .toast {
    position: fixed; left: 50%; bottom: calc(100px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 15px;
    opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw; text-align: center;
  }
  .toast.show { opacity: 1; }
  .busy { text-align: center; color: var(--muted); padding: 10px; }
</style>
</head>
<body>
<header>
  <h1>Byggfoto</h1>
  <button class="link" id="btnSettings">Innstillinger</button>
</header>

<main id="viewJob">
  <h2>Jobb</h2>
  <div class="card">
    <label for="fAddress">Adresse</label>
    <input id="fAddress" autocomplete="street-address" placeholder="Storgata 1, Oslo">
    <div class="row">
      <div>
        <label for="fProject">Prosjektnr.</label>
        <input id="fProject" inputmode="text" placeholder="1234">
      </div>
      <div>
        <label for="fDate">Dato</label>
        <input id="fDate" type="date">
      </div>
    </div>
    <label for="fHours">Timer totalt (valgfritt)</label>
    <input id="fHours" inputmode="decimal" placeholder="7,5">
  </div>

  <h2>Bilder <span id="photoCount"></span></h2>
  <div class="row" style="margin-bottom:12px">
    <button class="primary" id="btnCamera">Ta bilde</button>
    <button id="btnLibrary">Fra bilder</button>
  </div>
  <input type="file" id="inCamera" accept="image/*" capture="environment" class="hidden">
  <input type="file" id="inLibrary" accept="image/*" multiple class="hidden">
  <div id="busy" class="busy hidden">Behandler bilder …</div>
  <div id="photos"></div>
  <div id="empty" class="card empty">Ingen bilder ennå.<br>Trykk «Ta bilde» for å starte.</div>

  <div class="card office" id="officeBox">
    <span>Til: <b id="officeEmail">–</b></span>
    <button class="link" id="btnCopyEmail">Kopier</button>
  </div>
  <button class="danger" id="btnNewJob" style="width:100%">Ny jobb (tøm alt)</button>
</main>

<main id="viewSettings" class="hidden">
  <h2>Kontor</h2>
  <div class="card">
    <label for="fOffice">Kontorets e-post</label>
    <input id="fOffice" type="email" autocomplete="email" placeholder="eirik@firma.no">
    <p class="note">Vises når du sender. Trykk «Kopier» og lim inn i «Til»-feltet første gang. Mail husker adressen etterpå.</p>
  </div>
  <h2>Ferdige kommentarer</h2>
  <div class="card">
    <div id="commentList"></div>
    <div class="addrow">
      <input id="fNewComment" placeholder="Ny kommentar">
      <button class="primary" id="btnAddComment">Legg til</button>
    </div>
    <button class="link" id="btnResetComments" style="margin-top:8px">Tilbakestill standardliste</button>
  </div>
  <button class="primary" id="btnBack" style="width:100%">Tilbake</button>
</main>

<div class="bar" id="bar">
  <div class="bar-inner">
    <button class="primary" id="btnSend">Send til kontoret</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
  const DEFAULT_COMMENTS = [
    'Kubbing', 'Underlag', 'Gulv', 'Kjøkken', 'Staving', 'Retting',
    'Isolering', 'Spikerslag', 'Himling', 'Veggplater', 'Gips'
  ];
  const MAX_SIDE = 1600;
  const JPEG_QUALITY = 0.72;

  const $ = id => document.getElementById(id);
  const ls = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };

  // ---------- IndexedDB for photo blobs ----------
  let dbp;
  function db() {
    if (!dbp) dbp = new Promise((res, rej) => {
      const r = indexedDB.open('byggfoto', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('photos');
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    return dbp;
  }
  async function idb(mode, fn) {
    const d = await db();
    return new Promise((res, rej) => {
      const tx = d.transaction('photos', mode);
      const out = fn(tx.objectStore('photos'));
      tx.oncomplete = () => res(out && out.result);
      tx.onerror = () => rej(tx.error);
    });
  }
  const putBlob = (id, blob) => idb('readwrite', s => s.put(blob, id));
  const getBlob = id => idb('readonly', s => s.get(id));
  const delBlob = id => idb('readwrite', s => s.delete(id));
  const clearBlobs = () => idb('readwrite', s => s.clear());

  // ---------- State ----------
  const today = () => new Date().toISOString().slice(0, 10);
  let job = ls.get('job', null) || newJob();
  let comments = ls.get('comments', DEFAULT_COMMENTS.slice());
  let office = ls.get('office', '');
  const blobs = new Map();   // id -> Blob
  const urls = new Map();    // id -> object URL

  function newJob() { return { address: '', project: '', date: today(), hours: '', photos: [] }; }
  const saveJob = () => ls.set('job', job);

  // ---------- Image compression ----------
  function loadImage(file) {
    return new Promise((res, rej) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => { res(img); URL.revokeObjectURL(url); };
      img.onerror = () => { rej(new Error('Kunne ikke lese bildet')); URL.revokeObjectURL(url); };
      img.src = url;
    });
  }
  async function compress(file) {
    const img = await loadImage(file);
    const scale = Math.min(1, MAX_SIDE / Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.round(img.naturalWidth * scale), h = Math.round(img.naturalHeight * scale);
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    c.getContext('2d').drawImage(img, 0, 0, w, h);
    return new Promise(res => c.toBlob(res, 'image/jpeg', JPEG_QUALITY));
  }

  async function addFiles(files) {
    if (!files.length) return;
    $('busy').classList.remove('hidden');
    try {
      for (const f of files) {
        const blob = await compress(f);
        const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
        await putBlob(id, blob);
        blobs.set(id, blob);
        job.photos.push({ id, tags: [], text: '', hours: '' });
        saveJob();
      }
    } catch (e) {
      toast('Feil: ' + e.message);
    }
    $('busy').classList.add('hidden');
    renderPhotos();
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
  }

  // ---------- Rendering ----------
  function urlFor(id) {
    if (!urls.has(id) && blobs.has(id)) urls.set(id, URL.createObjectURL(blobs.get(id)));
    return urls.get(id) || '';
  }

  function renderPhotos() {
    const wrap = $('photos');
    wrap.innerHTML = '';
    $('empty').classList.toggle('hidden', job.photos.length > 0);
    $('photoCount').textContent = job.photos.length ? `(${job.photos.length})` : '';

    job.photos.forEach((p, i) => {
      const card = document.createElement('div');
      card.className = 'card photo';

      const head = document.createElement('div');
      head.className = 'photo-head';
      head.innerHTML = `<span>Bilde ${i + 1}</span>`;
      const del = document.createElement('button');
      del.className = 'danger'; del.textContent = 'Slett';
      del.onclick = async () => {
        if (!confirm(`Slette bilde ${i + 1}?`)) return;
        job.photos.splice(i, 1); saveJob();
        await delBlob(p.id); blobs.delete(p.id);
        if (urls.has(p.id)) { URL.revokeObjectURL(urls.get(p.id)); urls.delete(p.id); }
        renderPhotos();
      };
      head.appendChild(del);
      card.appendChild(head);

      const img = document.createElement('img');
      img.src = urlFor(p.id); img.alt = `Bilde ${i + 1}`; img.loading = 'lazy';
      card.appendChild(img);

      const chips = document.createElement('div');
      chips.className = 'chips';
      const all = comments.concat(p.tags.filter(t => !comments.includes(t)));
      all.forEach(t => {
        const b = document.createElement('button');
        b.className = 'chip' + (p.tags.includes(t) ? ' on' : '');
        b.textContent = t;
        b.onclick = () => {
          const k = p.tags.indexOf(t);
          if (k >= 0) p.tags.splice(k, 1); else p.tags.push(t);
          b.classList.toggle('on', k < 0);
          saveJob();
        };
        chips.appendChild(b);
      });
      card.appendChild(chips);

      const lt = document.createElement('label'); lt.textContent = 'Egen tekst (valgfritt)';
      const ta = document.createElement('textarea');
      ta.placeholder = 'F.eks. stue, ca. 12 m²';
      ta.value = p.text;
      ta.oninput = () => { p.text = ta.value; saveJob(); };
      const lh = document.createElement('label'); lh.textContent = 'Timer på denne oppgaven (valgfritt)';
      const ih = document.createElement('input');
      ih.inputMode = 'decimal'; ih.placeholder = '2'; ih.value = p.hours;
      ih.oninput = () => { p.hours = ih.value; saveJob(); };
      card.append(lt, ta, lh, ih);

      wrap.appendChild(card);
    });
  }

  function renderJobFields() {
    $('fAddress').value = job.address;
    $('fProject').value = job.project;
    $('fDate').value = job.date || today();
    $('fHours').value = job.hours;
  }

  function renderOffice() {
    $('officeEmail').textContent = office || 'ikke satt – se Innstillinger';
    $('btnCopyEmail').classList.toggle('hidden', !office);
    $('fOffice').value = office;
  }

  function renderCommentList() {
    const box = $('commentList');
    box.innerHTML = '';
    comments.forEach((c, i) => {
      const row = document.createElement('div');
      row.className = 'list-item';
      const s = document.createElement('span'); s.textContent = c;
      const b = document.createElement('button');
      b.className = 'danger'; b.textContent = 'Fjern';
      b.onclick = () => { comments.splice(i, 1); ls.set('comments', comments); renderCommentList(); };
      row.append(s, b);
      box.appendChild(row);
    });
    if (!comments.length) box.innerHTML = '<p class="note">Listen er tom.</p>';
  }

  // ---------- Email text ----------
  const num = s => { const n = parseFloat(String(s).replace(',', '.')); return isNaN(n) ? null : n; };
  const fmtNum = n => String(Math.round(n * 100) / 100).replace('.', ',');
  const fmtDate = d => d ? d.split('-').reverse().join('.') : '';
  const safe = s => String(s).trim().replace(/[^\wæøåÆØÅ-]+/g, '_').replace(/^_+|_+$/g, '');

  function fileName(i) {
    const base = safe(job.project) ? `P${safe(job.project)}` : 'Bilde';
    return `${base}_${String(i + 1).padStart(2, '0')}.jpg`;
  }

  function subject() {
    const parts = ['Jobbilder'];
    if (job.project) parts.push(`prosjekt ${job.project.trim()}`);
    if (job.address) parts.push(job.address.trim());
    parts.push(fmtDate(job.date));
    return parts.join(' – ');
  }

  function bodyText() {
    const L = [];
    L.push(subject(), '');
    L.push(`Adresse: ${job.address.trim() || '–'}`);
    L.push(`Prosjektnr.: ${job.project.trim() || '–'}`);
    L.push(`Dato: ${fmtDate(job.date) || '–'}`);
    const tot = num(job.hours);
    if (tot != null) L.push(`Timer totalt: ${fmtNum(tot)}`);
    L.push(`Antall bilder: ${job.photos.length}`, '');

    let sum = 0, anyTask = false;
    job.photos.forEach((p, i) => {
      L.push(`Bilde ${i + 1} (${fileName(i)})`);
      if (p.tags.length) L.push(`  Arbeid: ${p.tags.join(', ')}`);
      if (p.text.trim()) L.push(`  Merknad: ${p.text.trim()}`);
      const h = num(p.hours);
      if (h != null) { L.push(`  Timer: ${fmtNum(h)}`); sum += h; anyTask = true; }
      if (!p.tags.length && !p.text.trim() && h == null) L.push('  (ingen kommentar)');
      L.push('');
    });
    if (anyTask) L.push(`Sum timer per oppgave: ${fmtNum(sum)}`);
    return L.join('\n');
  }

  // ---------- Send ----------
  async function send() {
    if (!job.photos.length) { toast('Ta minst ett bilde først.'); return; }
    const files = job.photos.map((p, i) =>
      new File([blobs.get(p.id)], fileName(i), { type: 'image/jpeg' }));
    const data = { files, title: subject(), text: bodyText() };

    if (navigator.canShare && navigator.canShare({ files })) {
      try {
        await navigator.share(data);
        setTimeout(() => {
          if (confirm('Ble e-posten sendt?\nTrykk OK for å tømme jobben og starte en ny.')) resetJob();
        }, 400);
      } catch (e) {
        if (e.name !== 'AbortError') toast('Deling feilet: ' + e.message);
      }
    } else {
      // Fallback (e.g. desktop browser): open mail with text only.
      toast('Denne nettleseren kan ikke dele bilder. Bruk Safari på iPhone.');
      location.href = `mailto:${encodeURIComponent(office)}?subject=${encodeURIComponent(subject())}&body=${encodeURIComponent(bodyText())}`;
    }
  }

  async function resetJob() {
    await clearBlobs();
    blobs.clear();
    urls.forEach(u => URL.revokeObjectURL(u)); urls.clear();
    job = newJob(); saveJob();
    renderJobFields(); renderPhotos();
    window.scrollTo({ top: 0 });
  }

  // ---------- Misc ----------
  let toastTimer;
  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
  }

  async function copyOffice() {
    try { await navigator.clipboard.writeText(office); toast('E-post kopiert'); }
    catch { prompt('Kopier adressen:', office); }
  }

  function showSettings(on) {
    $('viewJob').classList.toggle('hidden', on);
    $('viewSettings').classList.toggle('hidden', !on);
    $('bar').classList.toggle('hidden', on);
    $('btnSettings').classList.toggle('hidden', on);
    if (on) renderCommentList(); else { renderOffice(); renderPhotos(); }
    window.scrollTo({ top: 0 });
  }

  // ---------- Wire up ----------
  ['address', 'project', 'date', 'hours'].forEach(k => {
    const el = $('f' + k[0].toUpperCase() + k.slice(1));
    el.addEventListener('input', () => { job[k] = el.value; saveJob(); });
  });
  $('btnCamera').onclick = () => $('inCamera').click();
  $('btnLibrary').onclick = () => $('inLibrary').click();
  $('inCamera').onchange = e => { addFiles([...e.target.files]); e.target.value = ''; };
  $('inLibrary').onchange = e => { addFiles([...e.target.files]); e.target.value = ''; };
  $('btnSend').onclick = send;
  $('btnCopyEmail').onclick = copyOffice;
  $('btnNewJob').onclick = () => { if (confirm('Tømme jobben og slette alle bilder i appen?\n(Bildene i Bilder-appen blir ikke slettet.)')) resetJob(); };
  $('btnSettings').onclick = () => showSettings(true);
  $('btnBack').onclick = () => showSettings(false);
  $('fOffice').oninput = e => { office = e.target.value.trim(); ls.set('office', office); };
  $('btnAddComment').onclick = () => {
    const v = $('fNewComment').value.trim();
    if (!v) return;
    if (!comments.includes(v)) comments.push(v);
    ls.set('comments', comments);
    $('fNewComment').value = '';
    renderCommentList();
  };
  $('fNewComment').addEventListener('keydown', e => { if (e.key === 'Enter') $('btnAddComment').click(); });
  $('btnResetComments').onclick = () => {
    if (!confirm('Tilbakestille til standardlisten?')) return;
    comments = DEFAULT_COMMENTS.slice(); ls.set('comments', comments); renderCommentList();
  };

  // ---------- Start ----------
  (async () => {
    renderJobFields(); renderOffice();
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
    try {
      const kept = [];
      for (const p of job.photos) {
        const b = await getBlob(p.id);
        if (b) { blobs.set(p.id, b); kept.push(p); }
      }
      if (kept.length !== job.photos.length) { job.photos = kept; saveJob(); }
    } catch (e) { toast('Kunne ikke laste lagrede bilder'); }
    renderPhotos();
  })();
})();
</script>
</body>
</html>
